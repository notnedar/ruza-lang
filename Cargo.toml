[package]
name = "ruza-lang"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "RuzaLangPatcher"
path = "src/main.rs"

[dependencies]
tao = "0.30"
wry = "0.47"
rfd = "0.15"
sysinfo = "0.32"
aes = "0.8"
flate2 = "1.0"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
