name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build & publish (e.g. v0.7.0)"
        required: true
        default: "v0.7.0"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    name: Build Windows x64 Binary
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        shell: pwsh
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force windows-dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/RuzaLangPatcher.exe" "windows-dist/RuzaLangPatcher.exe" -Force
          $sha = (Get-FileHash "windows-dist/RuzaLangPatcher.exe" -Algorithm SHA256).Hash
          Write-Host "Built RuzaLangPatcher.exe SHA256=$sha"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: windows-dist/RuzaLangPatcher.exe
          if-no-files-found: error

  build-android:
    name: Build Universal Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK Platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Configured release signing keystore."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found; falling back to debug signing."
          fi

      - name: Run unit tests & build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Stage & verify Android APK
        run: |
          set -euo pipefail
          mkdir -p android-dist
          cp android/app/build/outputs/apk/release/app-release.apk android-dist/RuzaLangPatcher.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose android-dist/RuzaLangPatcher.apk
          fi
          sha256sum android-dist/RuzaLangPatcher.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: android-dist/RuzaLangPatcher.apk
          if-no-files-found: error

  publish-release:
    name: Attest & Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release-dist

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-dist
          path: release-dist

      - name: Generate combined SHA256SUMS.txt
        run: |
          set -euo pipefail
          EXE_SHA=$(sha256sum release-dist/RuzaLangPatcher.exe | awk '{print toupper($1)}')
          APK_SHA=$(sha256sum release-dist/RuzaLangPatcher.apk | awk '{print toupper($1)}')
          EXE_MB=$(awk "BEGIN {printf \"%.2f\", $(stat -c%s release-dist/RuzaLangPatcher.exe)/1048576}")
          APK_MB=$(awk "BEGIN {printf \"%.2f\", $(stat -c%s release-dist/RuzaLangPatcher.apk)/1048576}")

          printf '%s  RuzaLangPatcher.exe\n%s  RuzaLangPatcher.apk\n' "$EXE_SHA" "$APK_SHA" > release-dist/SHA256SUMS.txt
          cat release-dist/SHA256SUMS.txt

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          {
            echo "RELEASE_TAG=$TAG"
            echo "EXE_SHA256=$EXE_SHA"
            echo "APK_SHA256=$APK_SHA"
            echo "EXE_MB=$EXE_MB"
            echo "APK_MB=$APK_MB"
          } >> "$GITHUB_ENV"

      - name: Attest build provenance (Windows + Android)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-dist/RuzaLangPatcher.exe
            release-dist/RuzaLangPatcher.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release_notes.md"
          cat <<EOF > "$NOTES_FILE"
          > [!IMPORTANT]
          > **Tested & Working In-Game (PC & Android) · Vibe-Coded Educational Project**
          > - Confirmed **tested and working in-game** on both PC and Android clients (standalone APK & PC/ADB).
          > - This is a **vibe-coded educational project** — use at your own risk and always rely on automatic backups & one-click **Rollback JP** if a future client update changes asset layouts.

          ## Ruza-Lang ${RELEASE_TAG} (EN / ID · PC + Standalone Android APK)

          Educational bilingual localization & exact-size asset-repacking suite (**English** & **Bahasa Indonesia**) available for both **Windows PC** (\`RuzaLangPatcher.exe\`) and **Standalone Android** (\`RuzaLangPatcher.apk\` — **no PC & no root required**!).

          ### Downloads
          | Platform | File | Size | Notes |
          | :--- | :--- | :---: | :--- |
          | **Windows PC (x64)** | \`RuzaLangPatcher.exe\` | ${EXE_MB} MB | PC Client + Android ADB patcher |
          | **Android (Universal APK)** | \`RuzaLangPatcher.apk\` | ${APK_MB} MB | Android 8–17 · No PC, No Root (Shizuku / SAF / Direct) |

          ### Standalone Android APK Preview (Portrait Phone & Landscape Tablet)
          | Phone (Home) | Phone (Files & Sync) |
          | :---: | :---: |
          | ![Android APK Home](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/screenshot-apk-home.png?v=070) | ![Android APK Files](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/screenshot-apk-files.png?v=070) |

          ![Android APK Landscape](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/screenshot-apk-tablet.png?v=070)

          ### Desktop Usage Walkthrough
          ![Ruza-Lang Usage Demo](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/usage.webp?v=070)

          ### In-Game Samples (\`EN\`)
          | Character Screen | Star Journey Record |
          | :---: | :---: |
          | ![Character Screen](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/sample-ingame-character.jpg) | ![Star Journey Record](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/sample-ingame-journey.jpg) |

          ![Settings Menu](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/sample-ingame-en.jpg)

          ### Highlights / Fitur Utama
          - **NEW — Standalone Universal Android APK (\`RuzaLangPatcher.apk\`, \`v0.7.0\`):** Patch directly on your Android phone with **zero laptop, zero root, and zero APK re-signing**!
            - Same launcher aesthetic (responsive Portrait phone + Landscape tablet/emulator left-rail, frosted-glass Settings cards, bilingual \`EN\`/\`ID\` toggle, live Activity Log, built-in Update Checker).
            - **Zero-PC Storage Access:** Supports **Shizuku** (Android 11–17 via on-phone Wireless Debugging), **SAF Folder Picker**, **Direct Storage**, and automatic **Root (\`su\`)** fallback with a built-in bilingual **Setup Guide**.
            - **Bit-Identical On-Device Repacking (~3 seconds):** Covers **77,190 strings (\`99.4%\`: \`VStringPool\` + \`Static UI KeyConfig\`)** plus **Cached News (\`EN\` / \`ID\`)**, Android Process Guard, automatic local backups, atomic file replacement + SHA-256 verification, and one-click **Rollback JP**.
          - **Desktop Launcher Platform Selector (\`PC\` | \`Android\`) & Built-In ADB Connect Guide (\`v0.6.1\`):** Switch between **PC Client** and **Android (ADB)** right from Home, with smart setup prompts, Wireless ADB (\`IP:Port\`), and a bilingual USB/Wi-Fi/Emulator ADB guide.
          - **Built-In SHA-256 Auto-Updater (\`v0.5.0\`):** Automatic update check on launch (plus manual **Check Updates** in **Files**), verified against official \`SHA256SUMS.txt\`.
          - **PC 4-Store Localization Pipeline (\`77,661\` strings):** \`VStringPool\` (\`74,055\`), \`Static UI KeyConfig\` (\`3,135\`), \`StaticPackage CSV\` (\`113\`), \`resources.assets\` (\`358\`) + **Translate News (\`EN\` / \`ID\`)**.
          - **Safety & Verification:** Live process guard (PC & Android), exact byte-size preservation, automatic backups, SHA-256 verification, and one-click **Rollback to Original JP**.

          ### Verified GitHub Actions Builds & Provenance
          Both binaries were compiled directly on GitHub's hosted runners (\`windows-latest\` & \`ubuntu-latest\`) from the public source tree in this commit:
          - **Workflow Run:** [View full build log](${RUN_URL})
          - **Windows x64:** \`RuzaLangPatcher.exe\` (${EXE_MB} MB) — SHA-256: \`${EXE_SHA256}\`
          - **Android APK:** \`RuzaLangPatcher.apk\` (${APK_MB} MB) — SHA-256: \`${APK_SHA256}\`
          - **Verify build attestation locally:**
            \`\`\`bash
            gh attestation verify RuzaLangPatcher.exe --owner notnedar
            gh attestation verify RuzaLangPatcher.apk --owner notnedar
            \`\`\`

          > *Educational localization & binary serialization study project. No proprietary assets are included.*
          EOF

          # Remove leading indentation added by YAML block scalar
          sed -i 's/^          //' "$NOTES_FILE"

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release-dist/RuzaLangPatcher.exe \
              release-dist/RuzaLangPatcher.apk \
              release-dist/SHA256SUMS.txt \
              --clobber --repo "${{ github.repository }}"
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG — Ruza-Lang Bilingual Patcher (PC + Android APK)" \
              --notes-file "$NOTES_FILE" \
              --repo "${{ github.repository }}"
          else
            gh release create "$RELEASE_TAG" \
              release-dist/RuzaLangPatcher.exe \
              release-dist/RuzaLangPatcher.apk \
              release-dist/SHA256SUMS.txt \
              --title "$RELEASE_TAG — Ruza-Lang Bilingual Patcher (PC + Android APK)" \
              --notes-file "$NOTES_FILE" \
              --repo "${{ github.repository }}"
          fi
