name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build & publish (e.g. v0.9.4)"
        required: true
        default: "v0.9.4"

permissions: {}

jobs:
  build-windows:
    name: Build Windows x64 Binary
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build release executable
        shell: pwsh
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force windows-dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/RuzaLangPatcher.exe" "windows-dist/RuzaLangPatcher.exe" -Force
          $sha = (Get-FileHash "windows-dist/RuzaLangPatcher.exe" -Algorithm SHA256).Hash
          Write-Host "Built RuzaLangPatcher.exe SHA256=$sha"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-dist
          path: windows-dist/RuzaLangPatcher.exe
          if-no-files-found: error

  build-android:
    name: Build Universal Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Ensure Android SDK Platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Configured release signing keystore."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found; falling back to debug signing."
          fi

      - name: Run unit tests & build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Stage & verify Android APK
        run: |
          set -euo pipefail
          mkdir -p android-dist
          cp android/app/build/outputs/apk/release/app-release.apk android-dist/RuzaLangPatcher.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose android-dist/RuzaLangPatcher.apk
          fi
          sha256sum android-dist/RuzaLangPatcher.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-dist
          path: android-dist/RuzaLangPatcher.apk
          if-no-files-found: error

  publish-release:
    name: Attest & Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-dist
          path: release-dist

      - name: Download Android artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-dist
          path: release-dist

      - name: Scan release binaries with ClamAV
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --quiet || true
          clamscan --infected --no-summary release-dist/RuzaLangPatcher.exe release-dist/RuzaLangPatcher.apk
          echo "ClamAV scan clean (0 threats detected)."

      - name: Generate combined SHA256SUMS.txt
        run: |
          set -euo pipefail
          EXE_SHA=$(sha256sum release-dist/RuzaLangPatcher.exe | awk '{print toupper($1)}')
          APK_SHA=$(sha256sum release-dist/RuzaLangPatcher.apk | awk '{print toupper($1)}')
          EXE_MB=$(awk "BEGIN {printf \"%.2f\", $(stat -c%s release-dist/RuzaLangPatcher.exe)/1048576}")
          APK_MB=$(awk "BEGIN {printf \"%.2f\", $(stat -c%s release-dist/RuzaLangPatcher.apk)/1048576}")

          printf '%s  RuzaLangPatcher.exe\n%s  RuzaLangPatcher.apk\n' "$EXE_SHA" "$APK_SHA" > release-dist/SHA256SUMS.txt
          cat release-dist/SHA256SUMS.txt

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          {
            echo "RELEASE_TAG=$TAG"
            echo "EXE_SHA256=$EXE_SHA"
            echo "APK_SHA256=$APK_SHA"
            echo "EXE_MB=$EXE_MB"
            echo "APK_MB=$APK_MB"
          } >> "$GITHUB_ENV"

      - name: Submit to VirusTotal (optional if VT_API_KEY secret is configured)
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -n "$VT_API_KEY" ]; then
            for f in release-dist/RuzaLangPatcher.exe release-dist/RuzaLangPatcher.apk; do
              echo "Submitting $f to VirusTotal..."
              curl -sS -X POST "https://www.virustotal.com/api/v3/files" \
                -H "x-apikey: $VT_API_KEY" \
                -F "file=@$f" >/dev/null || echo "VirusTotal upload skipped for $f"
            done
          else
            echo "VT_API_KEY secret not set; publishing direct SHA-256 VirusTotal lookup links."
          fi

      - name: Attest build provenance (Windows + Android)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release-dist/RuzaLangPatcher.exe
            release-dist/RuzaLangPatcher.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release_notes.md"
          cat <<EOF > "$NOTES_FILE"
          > [!IMPORTANT]
          > **Tested & Working In-Game (PC & Android) · Vibe-Coded Educational Project**
          > - Confirmed **tested and working in-game** on both PC and Android clients (standalone APK & PC/ADB).
          > - This is a **vibe-coded educational project** — use at your own risk and always rely on automatic backups & one-click **Rollback JP** if a future client update changes asset layouts.

          ## Ruza-Lang ${RELEASE_TAG} (EN / ID · PC + Standalone Android APK)

          Educational bilingual localization & exact-size asset-repacking suite (**English** & **Bahasa Indonesia**) available for both **Windows PC** (\`RuzaLangPatcher.exe\`) and **Standalone Android** (\`RuzaLangPatcher.apk\` — **no PC & no root required**!).

          ### Downloads
          | Platform | File | Size | Notes |
          | :--- | :--- | :---: | :--- |
          | **Windows PC (x64)** | \`RuzaLangPatcher.exe\` | ${EXE_MB} MB | PC Client + Android ADB patcher |
          | **Android (Universal APK)** | \`RuzaLangPatcher.apk\` | ${APK_MB} MB | Android 8–17 · No PC, No Root (Shizuku / SAF / Direct) |

          ### Standalone Android APK Preview (Portrait Phone & Landscape Tablet)
          | Phone (Home) | Phone (Files & Sync) |
          | :---: | :---: |
          | ![Android APK Home](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/screenshot-apk-home.png?v=094) | ![Android APK Files](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/screenshot-apk-files.png?v=094) |

          ![Android APK Landscape](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/screenshot-apk-tablet.png?v=094)

          ### Desktop Usage Walkthrough
          ![Ruza-Lang Usage Demo](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/usage.webp?v=094)

          ### In-Game Samples (\`EN\`) — Original Font vs. Compact Font (PC Only)
          | Original Font (Default) | Compact Font (\`Barlow Semi Condensed\` · PC Only) |
          | :---: | :---: |
          | ![Character Screen — Original](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/sample-ingame-character.jpg) | ![Character Screen — Compact](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/sample-ingame-character-barlow.jpg) |
          | ![Settings Menu — Original](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/sample-ingame-en.jpg) | ![Settings Menu — Compact](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/sample-ingame-settings-barlow.jpg) |

          ![Star Journey Record](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/sample-ingame-journey.jpg)

          ### Highlights / Fitur Utama
          - **NEW — Compact Font Info Tooltip (\`?\`) & Security/CI Hardening (\`v0.9.4\`):**
            - **Compact Font \`?\` Info Tooltip (\`EN\` & \`ID\`):** Added a clickable/hoverable \`?\` icon right beside \`Compact font (PC Only)\` with a plain-language explanation of what Compact Font does, how to toggle it on/off anytime, and why it's 100% safe & reversible.
            - **Continuous Security CI & Transparency:** Added **GitHub CodeQL**, **Dependabot**, **OpenSSF Scorecard**, automated **ClamAV** release scanning, direct **VirusTotal** links, \`SECURITY.md\`, and \`node tools/verify-resources.mjs\` payload verification.
          - **Raw \`<size=...%>\` Tag Hotfix (\`v0.9.3\`):**
            - Removed all \`167\` injected percentage \`<size=NN%>\` tags across \`EN\` & \`ID\` (\`110\` in \`Static UI EN\`, \`40\` in \`Static UI ID\`, \`8\` in \`VStringPool EN\`, \`9\` in \`VStringPool ID\`) that could print literally on non-RichText buttons such as Gacha \`10x Observe\` / \`10x Observasi\`, and fixed the duplicated Indonesian label \`Pemeliharaan Pemeliharaan\`.
          - **Optional Compact PC UI Font (Barlow Semi Condensed) & Loading Tip Wrapping (\`v0.9.2\`):**
            - **Optional Compact PC UI Font (\`Compact font (PC Only)\`):** Toggleable checkbox right above **Install Patch** on the Home screen! Replaces Latin UI glyphs across all active PC UI font assets with **Barlow Semi Condensed** (~15% narrower for cleaner button & menu fit) while preserving all original CJK glyphs (zero \`□□□\` tofu), exact \`0 B\` file sizes, automatic original backups, and automatic revert when unchecked or on **Rollback JP**.
            - **Wrapped Loading Screen Tips (\`EN\` & \`ID\`):** Wrapped all long single-line loading tips cleanly onto 2 centered lines (preventing horizontal off-screen clipping) and aligned terminology in \`1663607\` (\`Astral Insight\` / \`Star Journey Record\`).
          - **Gacha UI Fit Fixes & Android HyperOS Shizuku Improvements (\`v0.9.1\`):**
            - **Clean Single-Line Gacha Buttons (\`EN\` & \`ID\`):** Fixed truncated/wrapped Gacha buttons — \`1x Observation\` → \`1x Observe\`, \`10 Observations\` → \`<size=88%>10x Observe</size>\` (plus fitted \`ID\` \`<size=82%>1x Observasi</size>\` / \`<size=76%>10x Observasi</size>\`), \`Startrail Exchange\` → \`Exchange\` / \`Penukaran\`, and \`Observation Details\` → \`Details\` / \`Detail\`.
            - **Improved Android Shizuku Auto-Bind & Setup Guide:** Polls Shizuku \`UserService\` connection up to \`2s\` (fixes slow binds on Xiaomi/POCO HyperOS & ColorOS), auto-rescans when returning from the Shizuku app, logs actionable permission tips on bind timeout, and adds Xiaomi/POCO HyperOS & OPPO/Realme instructions right inside the in-app Setup Guide.
            - **Indonesian Documentation (\`README_ID.md\`):** Full Indonesian guide with top-of-page language switcher.
          - **Hotfix-Proof Universal Engine & Full \`r3273853\` / \`r3273851\` Support (\`v0.9.0\`):**
            - **Dynamic Bundle Auto-Discovery (\`PC\` & \`Android\`):** Automatically finds active \`VStringPool\` and \`Static UI KeyConfig\` \`.r\` bundles with zero hardcoded filenames or sub-bundle offsets across PC, Android ADB, Shizuku, SAF, and Direct Storage.
            - **Universal Content-Hash Matching (\`RZV2\`):** Matches all **\`76,180\`** \`VStringPool\` strings by \`FNV-1a64\` content hash + byte length with dynamic contiguous span repacking — works seamlessly across \`r3219596\`, \`r3219598\`, \`r3273851\`, \`r3273853\`, and future resource hotfixes!
            - **Smart Hotfix Version Sync:** Eliminates false \`Client Version Mismatch\` popups on compatible resource hotfixes (\`r3273851\` / \`r3273853\`+) with per-bundle \`_ruza_state.json\` tracking (including \`Custom OK\` state for custom packs) and \`<bundle>.original\` backups.
            - **+2,125 New Hotfix Strings (\`EN\` & \`ID\`):** Full translation of all \`2,125\` new \`r3273853\` strings (**\`79,786\` PC** / **\`79,315\` Android · \`99.4%\`**) + tightened Indonesian \`Static UI\` LZ4HC fit with verified free slack.
          - **Live Process-Guard Button Locking (\`v0.8.1\`):**
            - Automatically disables **Install Patch**, **Translate News**, and **Rollback JP** (updating the CTA to **\`Close Game First\` / \`Tutup Game Dulu\`**) whenever the target game or launcher is detected running on **Windows PC**, **Android ADB**, or **Standalone Android APK**.
            - On **Windows PC**, buttons automatically re-enable within 2 seconds after closing the game; on **Android APK**, tapping the red running banner opens **App Info (Force Stop)** and returning to Ruza-Lang auto-rescans and unlocks immediately.
          - **Bring Your Own Language Pack (BYOL), Contributor Kit & Combat Terminology Fix (\`v0.8.0\`):**
            - **Bring Your Own Language Pack (\`PC\`, \`Android ADB\`, & \`Standalone APK\`):** Load any custom \`.json\` language pack right inside **Files → Custom Language Pack → Load JSON** (with base inheritance \`en\`/\`id\`/\`jp\`, flat dictionary drop-in support, one-click starter template export on PC, and universal content-hash matching across PC & Android — 100% offline!).
            - **Community Language Contribution Kit:** Added [\`CONTRIBUTING.md\`](https://github.com/notnedar/ruza-lang/blob/main/CONTRIBUTING.md), starter template [\`patches/custom-pack-template.json\`](https://github.com/notnedar/ruza-lang/blob/main/patches/custom-pack-template.json), and zero-dependency validator CLI \`node tools/validate-pack.mjs <pack.json>\` (checks placeholders, rich-text tags, UI wrap risks, and UTF-8 byte budget).
            - **Combat Timing Terminology Pass (\`EN\` & \`ID\`):** Replaced all \`62 EN + 73 ID\` literal \`Just Block / Guard / Parry / Dodge / Evade\` entries with natural action-RPG timing terms (**\`Perfect Guard\`**, **\`Perfect Parry\`**, **\`Perfect Dodge\`**, **\`Parry Window / Celah Parry\`**, **\`Dodge Counter\`**, **\`Perfect Guard: Counter\`**) and fixed \`Guard\` (\`ID\` previously \`"Penjaga"\`).
          - **Contextual Localization, Official Glossary & UI Fit Overhaul (\`v0.7.1\`):**
            - Repaired \`6\` off-by-one chunk shifts (\`424\` entries including the \`Equip\` button), aligned \`3,362\` official global terms & 9 elements, applied \`162\` anti-wrap UI overrides, fixed Android 15–17 Edge-to-Edge insets, added automatic **Download Shizuku** popup, and made the APK \`100%\` non-root.
          - **Standalone Universal Android APK (\`RuzaLangPatcher.apk\`, \`v0.7.0\`):** Patch directly on your Android phone with **zero laptop, zero root, and zero APK re-signing** — responsive Portrait phone & Landscape tablet UI, **Shizuku** (Android 11–17 Wireless Debugging) + **SAF Folder Picker** + **Direct Storage**, **79,315 verified strings (\`99.4%\`)** + Cached News in ~3 seconds, automatic local backups, and one-click **Rollback JP**.
          - **Desktop Launcher Platform Selector (\`PC\` | \`Android\`) & Built-In ADB Connect Guide (\`v0.6.1\`):** Switch between **PC Client** and **Android (ADB)** right from Home, with smart setup prompts, Wireless ADB (\`IP:Port\`), and a bilingual USB/Wi-Fi/Emulator ADB guide.
          - **Built-In SHA-256 Auto-Updater (\`v0.5.0\`):** Automatic update check on launch (plus manual **Check Updates** in **Files**), verified against official \`SHA256SUMS.txt\`.
          - **PC 4-Store Localization Pipeline (\`79,786\` strings):** \`VStringPool\` (\`76,180\`), \`Static UI KeyConfig\` (\`3,135\`), \`StaticPackage CSV\` (\`113\`), \`resources.assets\` (\`358\`) + **Translate News (\`EN\` / \`ID\`)**.
          - **Safety & Verification:** Live process guard (PC & Android), exact byte-size preservation, automatic backups, SHA-256 verification, and one-click **Rollback to Original JP**.

          ### Verified GitHub Actions Builds, Security & Provenance
          Both binaries were compiled directly on GitHub's hosted runners (\`windows-latest\` & \`ubuntu-latest\`) from the public source tree in this commit, scanned with **ClamAV** (0 threats), and signed with **GitHub Build Provenance Attestation**:
          - **Workflow Run:** [View full build & ClamAV scan log](${RUN_URL})
          - **Windows x64:** \`RuzaLangPatcher.exe\` (${EXE_MB} MB) — SHA-256: \`${EXE_SHA256}\` · [VirusTotal Report](https://www.virustotal.com/gui/file/${EXE_SHA256})
          - **Android APK:** \`RuzaLangPatcher.apk\` (${APK_MB} MB) — SHA-256: \`${APK_SHA256}\` · [VirusTotal Report](https://www.virustotal.com/gui/file/${APK_SHA256})
          - **Verify build attestation locally:**
            \`\`\`bash
            gh attestation verify RuzaLangPatcher.exe --owner notnedar
            gh attestation verify RuzaLangPatcher.apk --owner notnedar
            \`\`\`
          - **Security Policy & Payload Audit:** See [\`SECURITY.md\`](https://github.com/notnedar/ruza-lang/blob/main/SECURITY.md) or run \`node tools/verify-resources.mjs\`.

          > *Educational localization & binary serialization study project. No proprietary assets are included.*
          EOF

          # Remove leading indentation added by YAML block scalar
          sed -i 's/^          //' "$NOTES_FILE"

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release-dist/RuzaLangPatcher.exe \
              release-dist/RuzaLangPatcher.apk \
              release-dist/SHA256SUMS.txt \
              --clobber --repo "${{ github.repository }}"
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG — Ruza-Lang Bilingual Patcher (PC + Android APK)" \
              --notes-file "$NOTES_FILE" \
              --repo "${{ github.repository }}"
          else
            gh release create "$RELEASE_TAG" \
              release-dist/RuzaLangPatcher.exe \
              release-dist/RuzaLangPatcher.apk \
              release-dist/SHA256SUMS.txt \
              --title "$RELEASE_TAG — Ruza-Lang Bilingual Patcher (PC + Android APK)" \
              --notes-file "$NOTES_FILE" \
              --repo "${{ github.repository }}"
          fi
