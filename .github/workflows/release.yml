name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build & publish (e.g. v0.6.1)"
        required: true
        default: "v0.6.1"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    name: Build Windows x64 Binary
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        shell: pwsh
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Prepare artifacts & SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force release-dist | Out-Null
          $src = "target/x86_64-pc-windows-msvc/release/RuzaLangPatcher.exe"
          $dst = "release-dist/RuzaLangPatcher.exe"
          Copy-Item $src $dst -Force

          $sha = (Get-FileHash $dst -Algorithm SHA256).Hash
          $mb = [math]::Round((Get-Item $dst).Length / 1MB, 2)
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "release-dist/SHA256SUMS.txt"),
            "$sha  RuzaLangPatcher.exe`n",
            (New-Object System.Text.UTF8Encoding $false)
          )

          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EXE_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EXE_MB=$mb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Built RuzaLangPatcher.exe ($mb MB) SHA256=$sha for tag $tag"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-dist/RuzaLangPatcher.exe

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          $sha = $env:EXE_SHA256
          $mb  = $env:EXE_MB
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          $template = @'
          > [!IMPORTANT]
          > **Tested & Working In-Game · Vibe-Coded Educational Project**
          > - Confirmed **tested and working in-game** on the current build.
          > - This is a **vibe-coded educational project** — use at your own risk and always rely on the automatic `_ENPatchBackup\` rollback if a future client update changes asset layouts.

          ## Ruza-Lang __TAG__ (EN / ID)

          Educational standalone bilingual localization & asset-repacking tool (**English** & **Bahasa Indonesia**).

          ### Usage Walkthrough
          ![Ruza-Lang Usage Demo](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/usage.webp)

          ### In-Game Samples (`EN`)
          | Character Screen | Star Journey Record |
          | :---: | :---: |
          | ![Character Screen](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/sample-ingame-character.jpg) | ![Star Journey Record](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/sample-ingame-journey.jpg) |

          ![Settings Menu](https://raw.githubusercontent.com/notnedar/ruza-lang/main/docs/sample-ingame-en.jpg)

          ### Highlights / Fitur Utama
          - **Home Platform Selector (`PC` | `Android`) & Built-In ADB Connect Guide (`v0.6.1`):** Switch between **PC Client** and **Android (ADB)** directly from the Home bottom dock, with smart missing-install prompts (**Browse Folder / Auto-Scan** for PC; **ADB Setup Guide / Choose Device / Browse `adb.exe`** for Android), **Wireless ADB (`IP:Port`)** connect, and a built-in bilingual USB/Wi-Fi/Emulator ADB connection guide.
          - **Android (ADB) Patching Mode (`v0.6.0`):** Patch real Android phones (USB/Wi-Fi Debugging) & Windows Android emulators (BlueStacks, LDPlayer, MuMu, MEmu, Nox) with **zero root and zero APK re-signing** — covers **77,190 strings (`99.4%`: `VStringPool` + `Static UI KeyConfig`)** plus **Android Cached News (`EN` / `ID`)**, Android Process Guard (`pidof`), PC backups (`%LOCALAPPDATA%\RuzaLang\AndroidBackups\`), atomic transfer + remote `sha256sum` verification, and one-click **Rollback JP**.
          - **Built-In SHA-256 Auto-Updater (`v0.5.0`):** Checks GitHub Releases automatically on launch (plus manual **Check Updates** in **Files**), verifies downloaded binaries against official `SHA256SUMS.txt` over strict allowlisted HTTPS, swaps the `.exe` atomically in-place, and auto-relaunches.
          - **Cleaner Launcher Polish & Portable Execution (`v0.4.2`–`v0.4.3`):** Removed all uppercase UI eyebrows and Activity Log dot; WebView2 profile stored cleanly in `%LOCALAPPDATA%\RuzaLang\WebView2` (zero `*.exe.WebView2` folder clutter).
          - **Client Version Sync Check (`v0.4.1`):** Checks client version + resource revision sync (PC `v1.0.2 · r3219598`, Android `v1.0.0 · r3219596`) with a non-blocking update recommendation if a newer client build is detected.
          - **Frameless PC Game Launcher UI (`v0.4.0`):** Clean `960×580` frameless desktop launcher with Windows 11 native rounded corners, custom draggable top bar (`—` / geometric `✕`), slim frosted left rail (`Home` · `Files` · `Android` · `News` · `Log` + `EN`/`ID`), original painted scenic hero canvas, bottom action dock with prominent **Install Patch** CTA + **Translate News**, and frosted-glass sub-pages.
          - **UI Fit Pass (`v0.2.1`):** Tightened quick-menu labels, event sidebar tabs, chapter headers, and banner descriptions + conservative TextMeshPro `<size=80%>` scaling on ultra-wide short prefab labels (`EN` & `ID`) to prevent overlap and `...` truncation.
          - **Bilingual Toggle (`EN` / `ID`):** Switch between English and Bahasa Indonesia anytime right inside the GUI.
          - **Dedicated `Translate News (EN / ID)` Button:** Translates cached in-game announcement HTML pages (`HTTPCache` + `Library v3`) with automatic backup restore on Rollback.
          - **PC 4-Store Localization Pipeline (`77,661` strings):**
            - `VStringPool` — `74,055` strings
            - `Static UI KeyConfig` — `3,135` strings
            - `StaticPackage CSV` — `113` strings
            - `resources.assets` — `358` strings
          - **Safety & Verification:** Live process guard (PC & Android), exact byte-size preservation, automatic backups, SHA-256 verification, and one-click **Rollback to Original JP**.

          ### Verified GitHub Actions Build & Provenance
          This executable was compiled directly on GitHub's hosted `windows-latest` runner from the public source tree in this commit (not uploaded from a personal machine):
          - **Workflow Run:** [View full build log](__RUN_URL__)
          - **File:** `RuzaLangPatcher.exe` (__MB__ MB, Windows x64)
          - **SHA-256:** `__SHA__`
          - **Verify build attestation locally:**
            ```bash
            gh attestation verify RuzaLangPatcher.exe --owner notnedar
            ```

          > *Educational localization & binary serialization study project. No proprietary assets are included.*
          '@

          $lines = $template -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }
          $notes = ($lines -join "`n")
          $notes = $notes.Replace('__TAG__', $tag).Replace('__SHA__', $sha).Replace('__MB__', $mb).Replace('__RUN_URL__', $runUrl)
          $notesFile = Join-Path $env:RUNNER_TEMP "release_notes.md"
          [System.IO.File]::WriteAllText($notesFile, $notes, (New-Object System.Text.UTF8Encoding $false))

          $ErrorActionPreference = "Continue"
          gh release view $tag --repo "${{ github.repository }}" 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"

          if ($exists) {
            gh release upload $tag "release-dist/RuzaLangPatcher.exe" "release-dist/SHA256SUMS.txt" --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --title "$tag — Ruza-Lang Bilingual Patcher (EN / ID)" --notes-file $notesFile --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag "release-dist/RuzaLangPatcher.exe" "release-dist/SHA256SUMS.txt" --title "$tag — Ruza-Lang Bilingual Patcher (EN / ID)" --notes-file $notesFile --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
